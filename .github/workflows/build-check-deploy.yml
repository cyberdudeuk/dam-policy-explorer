# Build the DAM Policy Explorer, run every check (including the negative tests that prove each check can fail),
# and publish to GitHub Pages only if all of them pass. Actions are pinned to full commit hashes.
name: Build, check and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-virtualenv --upgrade pip 2>/dev/null || true
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          npm ci --no-audit --no-fund
      - name: Build
        run: python -I tools/build.py --home-url "https://cyberdudeuk.github.io/dam-policy-explorer/"
      - name: Check (static, functional, 3 widths x 3 themes with axe-core, negative tests)
        run: python -I tests/check.py --negative
      - name: Power Apps build (same content as the site; fails on any generator check or if pa/ is out of date)
        run: |
          python -I tests/check_powerapp.py
          python -I tools/powerapp.py
          git diff --exit-code -- pa/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: out
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
